version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ['eslint*', 'typescript-eslint', 'prettier', 'vitest', '@vitest/*', 'typescript']
      mcp-sdk:
        patterns: ['@modelcontextprotocol/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Node major bumps need a tested better-sqlite3 prebuild; bump them deliberately.
      - dependency-name: node
        update-types: ['version-update:semver-major']
